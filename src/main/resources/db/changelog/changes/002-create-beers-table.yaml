databaseChangeLog:
  - changeSet:
      id: 002-create-beers-table
      author: Joe Martin
      changes:
        - createTable:
            tableName: beers
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
              - column:
                  name: abv
                  type: double
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: manufacturer_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_beers_manufacturer
                    references: manufacturers(id)
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
